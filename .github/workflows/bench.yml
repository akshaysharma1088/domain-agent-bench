name: bench

# Runs the full benchmark on free GitHub-hosted runners with an open-weights model.
# Actions tab -> bench -> Run workflow. Results land in the run summary and the "results" artifact.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model tag"
        default: "qwen2.5-coder:7b"
      temperature:
        description: "Sampling temperature (above 0 so repeats differ)"
        default: "0.2"
      tasks:
        description: "Optional task filter, e.g. I5,I6,I7,I8 (empty = all tasks)"
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        config: [B0, B1, S]
        repeat: [0, 1, 2]
    env:
      MODEL: ${{ inputs.model }}
      TEMPERATURE: ${{ inputs.temperature }}
      TASKS: ${{ inputs.tasks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ollama and pull the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          up() { curl -sf http://localhost:11434/api/version > /dev/null; }
          up || (nohup ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 60); do up && break; sleep 2; done
          up || { cat ollama.log; exit 1; }
          ollama pull "$MODEL" || { sleep 15; ollama pull "$MODEL"; }
          ollama show "$MODEL" | tee model-info.txt
      - name: Run
        run: |
          python run.py --backend openai --model "$MODEL" --temperature "$TEMPERATURE" \
            --configs "${{ matrix.config }}" --repeat-id "${{ matrix.repeat }}" --tasks "$TASKS" --traces --out out
          cp model-info.txt out/
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.config }}-${{ matrix.repeat }}
          path: out

  summarize:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: part-*
      - name: Merge and summarize
        run: |
          mkdir -p results
          cat parts/*/runs.jsonl > results/runs.jsonl
          mkdir -p results/traces && cp parts/*/traces/*.json results/traces/ || true
          cp "$(ls parts/*/model-info.txt | head -1)" results/ || true
          python summarize.py results/runs.jsonl | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results
